# ── Elasticsearch Connection ─────────────────────────────────────────────────
# Override these via environment variables in non-local environments.
es.host=localhost
es.port=9200
es.scheme=http
# es.api-key=   ← set via ES_API_KEY env var; never commit a real key

# ── Connection pool ──────────────────────────────────────────────────────────
es.max-conn-total=200
es.max-conn-per-route=20

# ── Timeouts (ms) ────────────────────────────────────────────────────────────
es.socket-timeout-ms=30000
es.connect-timeout-ms=5000
es.response-timeout-ms=30000

# ── Bulk indexing ────────────────────────────────────────────────────────────
es.bulk.batch-size=500
es.bulk.max-batch-bytes=5242880

# ── Resilience4j – CircuitBreaker ────────────────────────────────────────────
resilience4j.circuitbreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.slow-call-duration-threshold-ms=5000
resilience4j.circuitbreaker.sliding-window-size=10

# ── Resilience4j – Retry ─────────────────────────────────────────────────────
resilience4j.retry.max-attempts=3
resilience4j.retry.wait-duration-ms=100
resilience4j.retry.multiplier=2.0

# ── Logging ──────────────────────────────────────────────────────────────────
LOG_LEVEL=INFO
